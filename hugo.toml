baseURL = 'https://america.github.io/'
locale = 'ja-JP'
title = 'オブライエンの日誌'
theme = "PaperMod"

# 日本語をデフォルト言語とし、URLに /ja/ プレフィックスは付けない(既存記事のURLを変えないため)。
# 英語版は /en/ 配下に置かれる。翻訳ファイルは <slug>.en.md (または index.en.md) として追加する。
defaultContentLanguage = 'ja'
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10


[params]
  # 一部PaperMod固有の設定
  defaultTheme = "light" # 常に明るいテーマをデフォルトにする(手動でダークに切り替え可能)
  showReadingTime = true # 記事の読み時間を表示
  disableSpecial1st = false # 特殊な1記事目デザインを無効化
  enableGitInfo = true # 更新日時を表示
  mainSections = ["post"]  # ホームに並べるセクション
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  showtoc = true
  tocopen = true
  customJS = ["js/bundle.js"]
 
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  # ホーム上部の紹介
  [params.homeInfoParams]
    Title = "雑記"
    Content = "Linux / Arch / Waydroid などのメモ。備忘録でも、誰かの助けになりますように。"

  [params.assets]
  favicon = "/images/favicon.png"
  apple_touch_icon = "/images/apple-touch-icon.png"

  # 抜粋の長さ（トップの要約）
  summaryLength = 140

[menu]
  [[menu.main]]
    identifier = "categories"
    name = "カテゴリ"
    url = "/categories/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
    weight = 20

#  customJS = ["js/copy.js"]
#  copyCode = true
#  customCSS = ["css/custom.css"]

#[markup]
#  [markup.highlight]
#    noClasses = false

[languages]
  [languages.ja]
    label = "日本語"
    locale = "ja-JP"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
