baseURL = 'https://america.github.io/'
locale = 'ja-JP'
title = 'オブライエンの日誌'
theme = "PaperMod"
enableRobotsTXT = true

# 日本語をデフォルト言語とし、URLに /ja/ プレフィックスは付けない(既存記事のURLを変えないため)。
# 英語版は /en/ 配下に置かれる。翻訳ファイルは <slug>.en.md (または index.en.md) として追加する。
defaultContentLanguage = 'ja'
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10


[params]
  # 一部PaperMod固有の設定
  defaultTheme = "light" # 常に明るいテーマをデフォルトにする(手動でダークに切り替え可能)
  showReadingTime = true # 記事の読み時間を表示
  disableSpecial1st = false # 特殊な1記事目デザインを無効化
  enableGitInfo = true # 更新日時を表示
  mainSections = ["post"]  # ホームに並べるセクション
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  showtoc = true
  tocopen = true
  customJS = ["js/bundle.js"]
 
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  # ホーム上部の紹介
  [params.homeInfoParams]
    Title = "雑記"
    Content = "Linux・Arch の技術メモと、AI・労働・格闘ゲームの記事。"

  [params.assets]
  favicon = "/images/favicon.png"
  apple_touch_icon = "/images/apple-touch-icon.png"

  # 抜粋の長さ（トップの要約）
  summaryLength = 140

  # 検索(Fuse.js)の設定。設計書: Obsidian 22_設計書/blog-search.md
  # ignoreLocation: 長い記事の後半にしか無い言葉も見つける。
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    ignoreLocation = true
    threshold = 0.3
    minMatchCharLength = 2
    keys = ["title", "summary", "content"]

# 検索用のデータ(/index.json、/en/index.json)をホームから出力する。
# 設計書: Obsidian 22_設計書/blog-search.md
[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "categories"
    name = "カテゴリ"
    url = "/categories/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "search"
    name = "検索"
    url = "/search/"
    weight = 30

#  customJS = ["js/copy.js"]
#  copyCode = true
#  customCSS = ["css/custom.css"]

#[markup]
#  [markup.highlight]
#    noClasses = false

[languages]
  [languages.ja]
    label = "日本語"
    locale = "ja-JP"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2


# 多言語サイトマップは Hugo 標準の挙動に任せる。
# /sitemap.xml がインデックスになり /ja/sitemap.xml・/en/sitemap.xml を指す。
# [outputs] home に "Sitemap" を足すと home 直下2ページ分しか出ないバグになるため付けない。
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5
